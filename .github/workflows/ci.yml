name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tvg_test
          POSTGRES_USER: tvg
          POSTGRES_PASSWORD: tvg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tvg:tvg_test_password@localhost:5432/tvg_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ --select E,F,W,I --ignore E501,E711,E712,E741,F841,F401,F811
          ruff format --check app/

      - name: Type check (mypy)
        run: |
          pip install mypy types-python-jose types-python-dateutil
          mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Dependency vulnerability scan (pip-audit)
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          # One known, currently-unfixable finding is ignored here rather
          # than silently allowed to fail CI forever — tracked in
          # PARKING_LOT.md. (starlette's 7 CVEs and pytest's CVE, both
          # previously ignored here too, are fixed as of the fastapi
          # 0.111->0.141.1/pydantic 2.7->2.13 bump (P48) and the pytest
          # 8->9.1.1/pytest-asyncio 1.x bump (P49) respectively.)
          #  - PYSEC-2026-1325 (ecdsa): transitive python-jose dependency,
          #    never exercised (this app signs JWTs with HS256, not ECDSA).
          #    No fix version exists upstream.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Run tests
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=58 \
            --cov-config=.coveragerc

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # ── Frontend: lint + build ───────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        if: matrix.node-version == '20'
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit/component tests (Vitest)
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Install Playwright Chromium
        if: matrix.node-version == '20'
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        if: matrix.node-version == '20'
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run test:e2e

  # ── Docker build smoke test ──────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tvg-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: web
          push: false
          tags: tvg-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
