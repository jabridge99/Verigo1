[mypy]
plugins = sqlalchemy.ext.mypy.plugin

# app/models/*.py uses SQLAlchemy's classic Column()-style declarative
# mapping (not the newer Mapped[] typed style), so the SQLAlchemy mypy
# plugin can't infer scalar-vs-collection for relationship() calls that
# don't have an explicit type annotation on the left-hand side. This is
# a real static-typing gap (a full fix means retrofitting Mapped[] type
# hints across every relationship() in app/models/, a large, separate
# piece of work -- see PARKING_LOT.md) but not a source of runtime bugs:
# SQLAlchemy always resolves uselist correctly at runtime by inspecting
# the foreign key direction, independent of what mypy can infer.
[mypy-app.models.*]
disable_error_code = misc
